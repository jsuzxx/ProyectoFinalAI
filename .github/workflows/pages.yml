name: Publicar prototipo en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "prototype/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar la carpeta del prototipo
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototype

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
